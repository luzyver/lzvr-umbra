name: Feature request
description: An idea to make Umbra more useful
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem to solve
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposal
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried
