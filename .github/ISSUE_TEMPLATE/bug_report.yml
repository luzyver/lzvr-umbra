name: Bug report
description: Something is not working as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities here. See [SECURITY.md](../blob/master/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected, and what happened.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: The commit from the `latest` release notes (e.g. "Automated build from abc1234").
  - type: input
    id: system
    attributes:
      label: Server system
      placeholder: Ubuntu 24.04, amd64, kernel 6.8
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: Output of `journalctl -u umbra -n 100`. Remove keys, tokens, and public IPs first.
      render: text
