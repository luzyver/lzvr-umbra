# Cek tiap pull request dan push ke cabang selain master. Push ke master menjalankan cek yang sama
# lewat release.yml (workflow_call) sebelum rilis diterbitkan.
name: ci

on:
  pull_request:
  push:
    branches-ignore: [master]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Frontend
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm test
          npm run build

      - name: Go
        run: |
          go vet ./...
          go test ./...
          CGO_ENABLED=0 go build -o /dev/null ./cmd/umbra
