# Build Umbra tiap push ke master, lalu terbitkan ke rilis "latest".
# Server cukup unduh hasilnya (deploy/update.sh), tidak perlu build sendiri.
name: release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  # check, test frontend, go vet, dan go test harus lulus sebelum rilis dibuat.
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build frontend
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -f ../internal/ui/dist/index.html

      - name: Vet
        run: go vet ./...

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o deploy/umbra ./cmd/umbra

      - name: Paketkan
        run: |
          name=umbra-linux-${{ matrix.arch }}
          mkdir "$name"
          cp deploy/umbra deploy/install.sh deploy/update.sh deploy/umbra.service deploy/umbra.env "$name/"
          cp LICENSE "$name/"
          cp web/static/fonts/OFL-Manrope.txt "$name/LICENSE-Manrope.txt"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: umbra-linux-${{ matrix.arch }}
          path: umbra-linux-${{ matrix.arch }}.tar.gz*
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Terbitkan rilis latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest out/* \
            --target "$GITHUB_SHA" \
            --title "latest" \
            --notes "Build otomatis dari ${GITHUB_SHA::7}" \
            --latest
