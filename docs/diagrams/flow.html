<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Umbra from install to daily use</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* Same tokens as web/src/design.css. */
    :root {
      --paper: #dcdfdd; --panel: #e9ebea; --ink: #1b1b1a; --muted: #55524b;
      --rule: #adb2ae; --strong: #8b918d;
      --accent: #e9a31c; --accent-soft: #e3d6b4;
      --font-sans: 'Hanken Grotesk', system-ui, sans-serif;
      --font-mono: 'Sometype Mono', ui-monospace, monospace;
    }
    [data-theme='dark'] {
      --paper: #1c1e1d; --panel: #242625; --ink: #e9ebe8; --muted: #a4aaa5;
      --rule: #3d413f; --strong: #5b605d;
      --accent: #e9a31c; --accent-soft: #3a2f16;
    }
    body { font-family: var(--font-sans); background: var(--paper); color: var(--ink); padding: 3rem 2rem; }
    .frame { max-width: 560px; margin: 0 auto; }
    .diagram-container { width: 100%; overflow-x: auto; }
    h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 560px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }

    .paper { fill: var(--paper); }
    .node { fill: var(--panel); stroke: var(--strong); }
    .focal { fill: var(--accent-soft); stroke: var(--accent); }
    .edge { fill: none; stroke: var(--muted); stroke-width: 1; }
    .head { fill: var(--muted); }
    .name { font: 600 12px var(--font-sans); fill: var(--ink); }
    .sub, .lbl, .num { font: 10px var(--font-mono); fill: var(--muted); }
    .num { font-size: 11px; }
    .mid { text-anchor: middle; }
  </style>
</head>
<body>
  <div class="frame">
    <h1>From install to daily use</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 560 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="umbra-flow-title umbra-flow-desc">
        <title id="umbra-flow-title">Umbra from install to daily use</title>
        <desc id="umbra-flow-desc">After installation a five-step wizard runs in order; firewall rules must be confirmed within 60 seconds or they roll back automatically, then the panel is ready and later visits only need a sign-in.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head" points="0 0, 8 3, 0 6"/></marker>
        </defs>

        <rect class="paper" width="560" height="640"/>

        <!-- Arrows -->
        <path class="edge" d="M160,64 V92" marker-end="url(#arrow)"/>
        <path class="edge" d="M160,136 V164" marker-end="url(#arrow)"/>
        <path class="edge" d="M160,208 V236" marker-end="url(#arrow)"/>
        <path class="edge" d="M160,280 V308" marker-end="url(#arrow)"/>
        <path class="edge" d="M160,352 V380" marker-end="url(#arrow)"/>

        <path class="edge" d="M160,468 V504" marker-end="url(#arrow)"/>
        <text class="lbl" x="170" y="489">yes</text>

        <path class="edge" d="M272,424 H328 Q336,424 336,416 V338 Q336,330 328,330 H272" marker-end="url(#arrow)"/>
        <text class="lbl mid" x="304" y="414">no</text>
        <text class="lbl" x="346" y="380">rules rolled back</text>

        <path class="edge" d="M160,548 V576" marker-end="url(#arrow)"/>
        <path class="edge" d="M336,596 H272" marker-end="url(#arrow)"/>

        <!-- Nodes -->
        <rect class="paper" x="48" y="24" width="224" height="40" rx="20"/>
        <rect class="node" x="48" y="24" width="224" height="40" rx="20"/>
        <text class="name mid" x="160" y="42">Install</text>
        <text class="sub mid" x="160" y="55">install.sh prints the setup token</text>

        <rect class="paper" x="48" y="92" width="224" height="44" rx="6"/>
        <rect class="node" x="48" y="92" width="224" height="44" rx="6"/>
        <text class="num" x="64" y="118">1</text>
        <text class="name" x="84" y="111">Create the admin account</text>
        <text class="sub" x="84" y="125">with the setup token</text>

        <rect class="paper" x="48" y="164" width="224" height="44" rx="6"/>
        <rect class="node" x="48" y="164" width="224" height="44" rx="6"/>
        <text class="num" x="64" y="190">2</text>
        <text class="name" x="84" y="183">System check</text>
        <text class="sub" x="84" y="197">server requirements</text>

        <rect class="paper" x="48" y="236" width="224" height="44" rx="6"/>
        <rect class="node" x="48" y="236" width="224" height="44" rx="6"/>
        <text class="num" x="64" y="262">3</text>
        <text class="name" x="84" y="255">Server settings</text>
        <text class="sub" x="84" y="269">public address, port, subnet</text>

        <rect class="paper" x="48" y="308" width="224" height="44" rx="6"/>
        <rect class="node" x="48" y="308" width="224" height="44" rx="6"/>
        <text class="num" x="64" y="334">4</text>
        <text class="name" x="84" y="327">Firewall and NAT</text>
        <text class="sub" x="84" y="341">applied as a trial</text>

        <polygon class="paper" points="160,380 272,424 160,468 48,424"/>
        <polygon class="focal" points="160,380 272,424 160,468 48,424"/>
        <text class="name mid" x="160" y="422">Confirmed</text>
        <text class="sub mid" x="160" y="436">within 60 seconds?</text>

        <rect class="paper" x="48" y="504" width="224" height="44" rx="6"/>
        <rect class="node" x="48" y="504" width="224" height="44" rx="6"/>
        <text class="num" x="64" y="530">5</text>
        <text class="name" x="84" y="523">First device</text>
        <text class="sub" x="84" y="537">scan the QR or download profile</text>

        <rect class="paper" x="48" y="576" width="224" height="40" rx="20"/>
        <rect class="node" x="48" y="576" width="224" height="40" rx="20"/>
        <text class="name mid" x="160" y="594">Overview</text>
        <text class="sub mid" x="160" y="607">panel ready to use</text>

        <text class="lbl mid" x="424" y="566">later visits</text>
        <rect class="paper" x="336" y="576" width="176" height="40" rx="20"/>
        <rect class="node" x="336" y="576" width="176" height="40" rx="20"/>
        <text class="name mid" x="424" y="594">Sign in</text>
        <text class="sub mid" x="424" y="607">password + 2FA code</text>
      </svg>
    </div>
  </div>
</body>
</html>
